# AI CLI Configuration
# Place this file in ~/.config/ai-cli.conf or /etc/ai-cli.conf

[default]
# Default AI provider (claude, openai, gemini)
provider = claude

# Enable streaming output by default
stream = true

# Enable conversation history
history = true

# History file location
history_file = ~/.ai-cli-history

[claude]
# Claude configuration
model = claude-3-5-sonnet-20241022
max_tokens = 4096
temperature = 1.0

# Alternative models:
# claude-3-5-sonnet-20241022  - Latest, most capable
# claude-3-5-haiku-20241022   - Fast, cost-effective

[openai]
# OpenAI configuration
model = gpt-4-turbo
max_tokens = 4096
temperature = 1.0

# Alternative models:
# gpt-4-turbo        - Latest GPT-4
# gpt-4              - Standard GPT-4
# gpt-3.5-turbo      - Cheaper, faster

[gemini]
# Google Gemini configuration
model = gemini-pro
# For vision tasks, use: gemini-pro-vision

[system_prompts]
# Predefined system prompts for different tasks

power_electronics = You are an expert power electronics engineer with deep knowledge of circuit design, component selection, and thermal management. Provide detailed, accurate answers with calculations and safety considerations.

code_review = You are an experienced software architect and code reviewer. Focus on code quality, performance, security, and best practices. Provide specific, actionable feedback.

technical_writing = You are a technical writer specializing in clear, concise documentation. Structure information logically and use appropriate technical terminology.

debugging = You are an expert debugger. Analyze problems systematically, consider multiple hypotheses, and provide step-by-step troubleshooting guidance.

[aliases]
# Command aliases for quick access
calc = power calc
design = power design
review = claude --system code_review
explain = claude "Explain: "
summarize = claude "Summarize: "

[shortcuts]
# Query shortcuts
mosfet = Find MOSFET specifications and application notes for
buck = Design a buck converter with
led = Calculate LED current limiting resistor for
